name: Deploy to GitHub Pages

# Veröffentlicht den Inhalt des Repo-Roots (index.html & Co.) auf GitHub Pages.
# Läuft bei jedem Push auf main – also nach jedem gemergten Pull Request –
# und lässt sich zusätzlich manuell unter "Actions" starten.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Kein Build nötig: das Repo-Root ist die fertige Site.
          # .git und .github werden von der Action automatisch ausgeschlossen.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
